name: Deploy to Kopierhelfer

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Versionsdatei schreiben
        run: |
          echo "commit: ${{ github.sha }}" > public/deploy-version.txt
          echo "branch: ${{ github.ref_name }}" >> public/deploy-version.txt
          echo "deployed: $(date -u +'%Y-%m-%d %H:%M UTC')" >> public/deploy-version.txt

      - name: SSH-Key laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Host-Key vertrauen
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Per rsync deployen
        run: |
          rsync -avz --delete \
            --exclude 'data/' \
            --exclude 'public/masks/config.json' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'test-flow.sh' \
            --exclude 'test-flow.ps1' \
            --exclude 'debug-totp.php' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # rsync bringt bei jedem Deploy die Datei-Rechte vom GitHub-Runner mit
      # (i.d.R. kein Gruppen-Schreibzugriff für www-data) und setzt damit die
      # manuell gesetzten Rechte auf public/masks/ immer wieder zurück.
      # Deshalb hier automatisch nach jedem Deploy wiederherstellen, damit
      # der Masken-Editor dauerhaft speichern kann, ohne dass das nach jedem
      # Push erneut von Hand gemacht werden muss.
      - name: Schreibrechte für Masken-Editor sichern
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo chgrp -R www-data ${{ secrets.DEPLOY_PATH }}/public/masks && sudo chmod -R 775 ${{ secrets.DEPLOY_PATH }}/public/masks"
